spring:
  application:
    name: image-hotspot-demo
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

server:
  port: ${PORT:8080}
  compression:
    enabled: true
  error:
    include-message: never

hotspot:
  data-directory: ${HOTSPOT_DATA_DIR:./data}
  max-image-bytes: 10485760
