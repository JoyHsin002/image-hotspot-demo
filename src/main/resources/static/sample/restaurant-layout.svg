<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">智慧餐饮门店测试平面图</title>
  <desc id="desc">带座位区、收银区、后厨、冷库和办公室的餐饮门店平面图。</desc>
  <defs>
    <linearGradient id="floor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f7f5"/>
      <stop offset="1" stop-color="#e8e8e4"/>
    </linearGradient>
    <linearGradient id="back" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dcecf0"/>
      <stop offset="1" stop-color="#c9dce1"/>
    </linearGradient>
    <pattern id="tile" width="52" height="52" patternUnits="userSpaceOnUse">
      <path d="M52 0H0V52" fill="none" stroke="#d7dad8" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#23344f" flood-opacity=".15"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="#d9d8d2"/>
  <rect x="38" y="38" width="1524" height="824" rx="8" fill="url(#floor)" stroke="#aeb2af" stroke-width="8"/>
  <rect x="50" y="50" width="1500" height="800" fill="url(#tile)" opacity=".9"/>

  <!-- rear service rooms -->
  <g stroke="#7a8b92" stroke-width="7">
    <rect x="63" y="63" width="196" height="183" fill="#cddfe5"/>
    <rect x="259" y="63" width="202" height="183" fill="#d7e6e9"/>
    <rect x="461" y="63" width="288" height="183" fill="#d2e4e8"/>
    <rect x="749" y="63" width="785" height="183" fill="url(#back)"/>
  </g>
  <g fill="#40515b" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="30" font-weight="700" text-anchor="middle">
    <text x="161" y="154">办公室</text>
    <text x="360" y="154">冷库</text>
    <text x="605" y="154">食品储藏室</text>
    <text x="1142" y="154">后厨 / 出餐区</text>
  </g>

  <!-- kitchen equipment -->
  <g fill="#526872" stroke="#364a54" stroke-width="5">
    <rect x="790" y="92" width="270" height="66" rx="7"/>
    <rect x="1085" y="92" width="173" height="66" rx="7"/>
    <rect x="1284" y="92" width="205" height="66" rx="7"/>
    <rect x="804" y="178" width="188" height="40" rx="6"/>
    <rect x="1017" y="178" width="220" height="40" rx="6"/>
    <rect x="1262" y="178" width="220" height="40" rx="6"/>
  </g>

  <!-- counter -->
  <g filter="url(#shadow)">
    <path d="M1110 342h372v122h-290v152h-82z" fill="#f6f7f7" stroke="#8d969b" stroke-width="7"/>
    <rect x="1178" y="370" width="96" height="62" rx="8" fill="#2c4057"/>
    <rect x="1192" y="382" width="68" height="38" rx="4" fill="#79a8e8"/>
    <rect x="1311" y="372" width="112" height="36" rx="7" fill="#b7c3ca"/>
  </g>
  <text x="1300" y="515" fill="#40515b" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="29" font-weight="700" text-anchor="middle">收银 / 服务台</text>

  <!-- seating tables -->
  <g filter="url(#shadow)" stroke="#7f8789" stroke-width="5">
    <g transform="translate(165 350)">
      <rect x="0" y="0" width="285" height="93" rx="13" fill="#ffffff"/>
      <rect x="18" y="-58" width="83" height="42" rx="14" fill="#cdd1d0"/>
      <rect x="184" y="-58" width="83" height="42" rx="14" fill="#cdd1d0"/>
      <rect x="18" y="109" width="83" height="42" rx="14" fill="#cdd1d0"/>
      <rect x="184" y="109" width="83" height="42" rx="14" fill="#cdd1d0"/>
    </g>
    <g transform="translate(552 350)">
      <rect x="0" y="0" width="285" height="93" rx="13" fill="#ffffff"/>
      <rect x="18" y="-58" width="83" height="42" rx="14" fill="#cdd1d0"/>
      <rect x="184" y="-58" width="83" height="42" rx="14" fill="#cdd1d0"/>
      <rect x="18" y="109" width="83" height="42" rx="14" fill="#cdd1d0"/>
      <rect x="184" y="109" width="83" height="42" rx="14" fill="#cdd1d0"/>
    </g>
    <g transform="translate(165 650)">
      <rect x="0" y="0" width="285" height="93" rx="13" fill="#ffffff"/>
      <rect x="18" y="-58" width="83" height="42" rx="14" fill="#cdd1d0"/>
      <rect x="184" y="-58" width="83" height="42" rx="14" fill="#cdd1d0"/>
      <rect x="18" y="109" width="83" height="42" rx="14" fill="#cdd1d0"/>
      <rect x="184" y="109" width="83" height="42" rx="14" fill="#cdd1d0"/>
    </g>
    <g transform="translate(552 650)">
      <rect x="0" y="0" width="285" height="93" rx="13" fill="#ffffff"/>
      <rect x="18" y="-58" width="83" height="42" rx="14" fill="#cdd1d0"/>
      <rect x="184" y="-58" width="83" height="42" rx="14" fill="#cdd1d0"/>
      <rect x="18" y="109" width="83" height="42" rx="14" fill="#cdd1d0"/>
      <rect x="184" y="109" width="83" height="42" rx="14" fill="#cdd1d0"/>
    </g>
  </g>

  <!-- entrance and circulation -->
  <path d="M960 846v-110h155v110" fill="#eef0ee" stroke="#9ca4a1" stroke-width="7"/>
  <path d="M1015 846a72 72 0 0 1 72-72" fill="none" stroke="#9ca4a1" stroke-width="4" stroke-dasharray="10 10"/>
  <text x="1037" y="821" fill="#53606a" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="700" text-anchor="middle">入口</text>

  <!-- labels -->
  <g fill="#6a747a" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="28" font-weight="700">
    <text x="160" y="292">用餐区 A</text>
    <text x="548" y="292">用餐区 B</text>
    <text x="115" y="835">智慧餐饮门店 · Hotspot Studio 测试图</text>
  </g>
</svg>
