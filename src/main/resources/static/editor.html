<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>点位编辑器</title><link rel="stylesheet" href="/assets/app.css"></head><body><header><strong>点位配置后台</strong><a href="/viewer.html">展示页面</a></header><main class="page"><section class="card row"><form id="upload" class="row"><input name="name" placeholder="场景名称" required><input name="image" type="file" accept="image/png,image/jpeg,image/gif,image/webp" required><button>上传并创建</button></form><button id="sample">一键创建示例</button><select id="scenes"></select><button id="remove" class="danger">删除场景</button></section><section class="layout"><div class="card"><div class="row"><strong id="title">请选择场景</strong><label>缩放 <input id="zoom" type="range" min="50" max="200" value="100"> <span id="zoomText">100%</span></label><button id="save">保存草稿</button><button id="publish">发布</button></div><p class="muted">点击图片新增点位；拖拽定位；方向键微调（Shift 加速）。坐标按比例保存。</p><div class="stage"><div id="canvas" class="canvas"><img id="image" draggable="false"></div></div></div><aside class="card"><h3>点位列表</h3><div id="list" class="hotspot-list"></div><div id="form"></div></aside></section></main><script type="module" src="/assets/editor.js"></script></body></html>
