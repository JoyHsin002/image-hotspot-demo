name: Bootstrap full project

on:
  push:
    branches: ["main"]

permissions:
  contents: write

concurrency:
  group: bootstrap-image-hotspot-demo
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect bundle
        id: bundle
        shell: bash
        run: |
          if compgen -G ".bootstrap/frontend.tar.gz.b64.*" > /dev/null; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Java 17
        if: steps.bundle.outputs.present == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Restore frontend bundle
        if: steps.bundle.outputs.present == 'true'
        shell: bash
        run: |
          cat .bootstrap/frontend.tar.gz.b64.* | base64 --decode > /tmp/frontend.tar.gz
          tar -xzf /tmp/frontend.tar.gz
      - name: Verify complete project
        if: steps.bundle.outputs.present == 'true'
        run: ./mvnw -B verify
      - name: Commit generated project
        if: steps.bundle.outputs.present == 'true'
        shell: bash
        run: |
          rm -rf .bootstrap .github/workflows/bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add hotspot editor frontend"
          git push origin HEAD:main
